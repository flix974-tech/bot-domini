# Esempio di Nginx sul server di origine.
# Il wildcard *.simone.net è già puntato (proxy Cloudflare) all'IP di questo server.
# Nginx accetta QUALSIASI sottodominio e lo inoltra alla tua app.
# Il sottodominio è l'identità della sessione: la tua app lo legge dall'header Host.

server {
    listen 80;
    # Accetta ogni sottodominio di simone.net (e altri domini del server)
    server_name ~^(?<sub>[a-z0-9-]+)\.simone\.net$;

    location / {
        proxy_pass http://127.0.0.1:8080;   # <-- la tua app interna (HTTP)
        proxy_set_header Host $host;          # la app legge il sottodominio da qui
        proxy_set_header X-Session $sub;      # opzionale: sottodominio estratto
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Per un secondo dominio sullo stesso server, aggiungi un altro server_name
# oppure un blocco server separato con lo stesso proxy_pass.
